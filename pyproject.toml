[project]
name = "phipy"
version = "0.1.0"
description = "General-purpose scientific utility library."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.4.0",
    "scipy>=1.13.1",
    "tqdm>=4.66.0",
    "trimesh>=4.6.13",
    "manifold3d>=3.5.1",
    "phipy-plots @ git+https://github.com/phipi89/phipy-plots.git@v0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true
